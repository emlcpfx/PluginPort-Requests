name: Plugin request
description: Request a new plugin or a change to an existing PluginPort plugin.
title: "[Plugin request]: "
labels: ["plugin-request"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you want to achieve. An intake assistant will ask any necessary follow-up questions here.
        Do not include confidential assets, credentials, or client information.
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Select the product that owns this request.
      options:
        - PluginPort / shared plugins
        - ScriptUI Panels
        - HDM AEIO
        - EXR AEIO
        - Denoise Video
        - IBK Keyer
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a user be able to do when this is complete?
      placeholder: Describe the result, not just a technical implementation.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Example workflow
      description: Describe a typical before-and-after workflow, including host application/version when relevant.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or acceptance criteria
      description: Include must-haves, performance needs, compatibility, visual references, or what would make this successful.
  - type: textarea
    id: crash_evidence
    attributes:
      label: Crash evidence or PostHog report
      description: Paste a PostHog error-tracking URL/ID, stack trace, reproduction steps, or a public-safe crash-log excerpt.
      placeholder: PostHog error URL, error ID, stack trace, and how to reproduce.
  - type: markdown
    attributes:
      value: |
        ## Attachments
        After opening the issue, drag images, screen recordings, or log files into a comment to attach them. This is a public repository: remove customer names, email addresses, license keys, file paths, project files, and any other confidential data before uploading.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have
        - Important
        - Urgent
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Preferred AI provider
      description: Choose the agent that should clarify and implement this request.
      options:
        - Codex
        - Claude
        - Gemini
    validations:
      required: true
